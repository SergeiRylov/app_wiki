{% load i18n %}

<div class="modal-dialog modal-xl">
    <form method="post" action="{% url 'app_wiki:create' %}">
        {% csrf_token %}
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">{% trans 'Create Article' %}</h4>
                <button class="btn-close py-0" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                {% include 'app_base/forms/select2.html' with field=form.parent %}
                {% include 'app_base/forms/input.html' with field=form.title %}
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" type="button" onclick="formSubmit(this);">{% trans 'Save' %}</button>
                <button class="btn btn-link" type="button" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </form>
</div>
