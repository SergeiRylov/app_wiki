{% load i18n %}

<div class="card">
    <div class="card-header">
        <h4 class="card-title">
            {% trans 'Attachments' %}
        </h4>
        <div class="card-tools">
            <div class="btn-group">
                <button type="button" class="btn btn-success dropdown-toggle" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <i class="bi bi-plus"></i>
                </button>
                <ul class="dropdown-menu">
                    <li>
                        <a class="dropdown-item modal-link" href="{% url 'app_wiki:images-add' struct.id %}">
                            {% trans 'Image' %}
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="#">
                            {% trans 'File' %}
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="card-body">
        {% for child in children %}
        <a href="{% url 'app_wiki:view' child.id %}">
            {{child.article_title }}
        </a>
        <br>
        {% endfor %}
    </div>
</div>
