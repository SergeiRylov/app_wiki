{% load i18n %}

<div class="modal-dialog">
    <form method="post" action="{% url 'app_wiki:images-edit' struct.id image.id %}">
        {% csrf_token %}
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">{% trans 'Edit image' %}</h4>
                <button class="btn-close py-0" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img src="{{image.file.url}}" alt="{{image.description|default:''}}" class="card-img-top mb-2" loading="lazy">
                {% include 'app_base/forms/input.html' with field=form.description %}
            </div>
            <div class="modal-footer justify-content-between">
                <button class="btn btn-danger" type="submit" name="submit" value="delete">{% trans 'Delete' %}</button>
                <div>
                    <button class="btn btn-primary" type="button" onclick="formSubmit(this);">{% trans 'Save' %}</button>
                    <button class="btn btn-link" type="button" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </form>
</div>
